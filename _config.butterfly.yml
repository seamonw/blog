# Butterfly 主题配置（覆盖 node_modules/hexo-theme-butterfly/_config.yml 中的同名项）
# 文档：https://butterfly.js.org/

# --------------------------------------
# 导航
# --------------------------------------

nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: true

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags

social:
  fab fa-github: https://github.com/seamonw || GitHub || '#24292e'
  fas fa-rss: /atom.xml || RSS || '#f4a261'

# --------------------------------------
# 图片
# --------------------------------------

favicon: /img/favicon.ico

avatar:
  img: https://avatars.githubusercontent.com/u/20677925?v=4
  effect: true

disable_top_img: false

# 顶部大图走在线随机图源，每次刷新换一张
default_top_img: https://picsum.photos/1920/1080
index_img: https://picsum.photos/1920/1080
archive_img: https://picsum.photos/1920/1080
tag_img: https://picsum.photos/1920/1080
category_img: https://picsum.photos/1920/1080
footer_img: https://picsum.photos/1920/600

cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 文章没设置 cover 时，从下面这组图里随机取一张
  default_cover:
    - https://picsum.photos/seed/butterfly1/1200/600
    - https://picsum.photos/seed/butterfly2/1200/600
    - https://picsum.photos/seed/butterfly3/1200/600
    - https://picsum.photos/seed/butterfly4/1200/600
    - https://picsum.photos/seed/butterfly5/1200/600
    - https://picsum.photos/seed/butterfly6/1200/600

# --------------------------------------
# 首页
# --------------------------------------

subtitle:
  enable: true
  effect: true
  typed_option:
  source: false
  sub:
    - 业精于勤荒于嬉
    - C++ / 游戏后端 / 分布式

# 封面与文字左右交替
index_layout: 3

index_post_content:
  method: 3
  length: 300

# --------------------------------------
# 文章
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/seamonw
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

related_post:
  enable: true
  limit: 6
  date_type: created

post_pagination: 1

code_blocks:
  theme: darker
  macStyle: true
  height_limit: false
  word_wrap: false
  copy: true
  language: true
  shrink: false
  fullpage: false

# --------------------------------------
# 页脚 / 侧栏
# --------------------------------------

footer:
  owner:
    enable: true
    since: 2022
  copyright:
    enable: true
    version: true

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 业精于勤荒于嬉
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/seamonw
  card_announcement:
    enable: true
    content: 记录 C++、游戏后端与工具链上的踩坑与心得。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    # 标签云上色，首页更有颜色
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: YYYY 年 MM 月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# --------------------------------------
# 交互与外观
# --------------------------------------

readmode: true

darkmode:
  enable: true
  button: true
  # 1: 跟随系统设置
  autoChangeMode: 1

display_mode: light

# 主色调：以蓝青为主，链接、按钮、目录各自用不同的强调色
theme_color:
  enable: true
  main: '#49B1F5'
  paginator: '#00c4b6'
  button_hover: '#FF7242'
  text_selection: '#00c4b6'
  link_color: '#0a7cff'
  meta_color: '#858585'
  hr_color: '#A4D8FA'
  code_foreground: '#F47466'
  code_background: 'rgba(27, 31, 35, .05)'
  toc_color: '#00c4b6'
  blockquote_padding_color: '#49b1f5'
  blockquote_background_color: '#49b1f5'
  scrollbar_color: '#49b1f5'
  meta_theme_color_light: '#ffffff'
  meta_theme_color_dark: '#0d0d0d'

rounded_corners_ui: true

hr_icon:
  enable: true

enter_transitions: true

# 图片点击放大
lightbox: fancybox

# --------------------------------------
# 搜索 / 字数统计
# --------------------------------------

# 依赖 hexo-generator-searchdb，路径取站点配置里的 search.path
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false
    pagination:
      enable: false
      hitsPerPage: 8

# 依赖 hexo-wordcount
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 不接第三方统计
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# 暂不开启分享和评论
share:
  use:

comments:
  use:
